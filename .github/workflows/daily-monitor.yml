name: daily-monitor
# Weekdays 22:45 UTC = after the US close in both summer (20:00 UTC) and winter (21:00 UTC) time.
# GitHub may start scheduled jobs late, and pauses them after ~60 days without repo activity: if the emails stop, check the Actions tab.
on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Update prices, rebuild the active books, write the logs
        id: mon
        continue-on-error: true      # still commit what was written, then fail the job below
        run: python -m monitor.daily
      - name: Show the summary
        if: always()
        run: cat monitor/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/signals.csv monitor/paper_nav.csv monitor/latest.md
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "monitor: daily update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: Fail the job if the monitor reported problems
        if: steps.mon.outcome == 'failure'
        run: exit 1
